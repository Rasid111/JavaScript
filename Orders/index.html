<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #list{
            display: grid;
            grid-template-columns: auto auto auto;
            padding: 30px 30px;
            gap:  30px 30px;
        }

        #list li{
           border: 2px solid black;
           padding: 10px;
           cursor: pointer;
        }

        #list li:hover{
            border: 2px solid blue;

        }

    </style>
    <title>Document</title>
</head>
<body>
    <form>
        <input type="text">
        <br>
        <input type="email">
        <br>
        <input type="number">
        <br>
    </form>
    <button>Recieve order</button>
    <ul id="list"></ul>
    <script src="scripts.js"></script>
</body>
</html>
